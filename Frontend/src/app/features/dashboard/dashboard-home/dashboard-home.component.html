<div class="dashboard-page">
  <!-- WELCOME HEADER -->
  <header class="dashboard-hero">
    <div class="hero-content">
      <div class="greeting-row">
        <h1>Hi {{ authService.currentUser()?.name }}</h1>
        <span class="role-display">({{ authService.currentUser()?.role }})</span>
      </div>
      <p class="hero-subtitle">What do you want to do today?</p>
    </div>
  </header>

  <!-- PLANNING STATUS BANNER -->
  <section class="status-banner-container" *ngIf="!activePlan() && authService.isTeamLead()">
    <div class="status-banner info">
      <mat-icon>info</mat-icon>
      <div class="banner-text">
        <strong>No planning weeks yet.</strong>
        <span>Click 'Start a New Week' to begin!</span>
      </div>
    </div>
  </section>

  <!-- TEAM LEAD ACTION GRID -->
  <section class="action-grid" *ngIf="authService.isTeamLead()">
    <app-action-card
      icon="calendar_month"
      title="Start a New Week"
      description="Set up a new planning cycle, define availability and category budgets."
      route="/planning"
    ></app-action-card>

    <app-action-card
      icon="assignment"
      title="Manage Backlog"
      description="Add, edit or browse work items. Prepare your engineering roadmap."
      route="/backlog"
    ></app-action-card>

    <app-action-card
      icon="group"
      title="Manage Team Members"
      description="View capacity and manage your engineering squad members."
      route="/team"
    ></app-action-card>

    <app-action-card
      icon="task_alt"
      title="Assignments"
      description="Review task assignments and project workload distribution."
      route="/assignment"
    ></app-action-card>
  </section>

  <!-- TEAM MEMBER ACTION GRID -->
  <section class="action-grid" *ngIf="!authService.isTeamLead()">
    <app-action-card
      icon="list_alt"
      title="My Tasks"
      description="View and manage the tasks assigned to you for the current week."
      route="/my-tasks"
    ></app-action-card>

    <app-action-card
      icon="trending_up"
      title="Update Progress"
      description="Log your daily progress and mark tasks as complete."
      route="/update-progress"
    ></app-action-card>

    <app-action-card
      icon="calendar_today"
      title="Weekly Plan"
      description="View the current week's global plan and team allocations."
      route="/planning/current"
    ></app-action-card>

    <app-action-card
      icon="history"
      title="Past Weeks"
      description="Browse your personal task history from previous weeks."
      route="/planning/history"
    ></app-action-card>
  </section>

  <!-- BOTTOM UTILITY BAR -->
  <footer class="utility-bar">
    <div class="utility-group">
      <button mat-stroked-button color="primary" (click)="onDownloadData()">
        <mat-icon>download</mat-icon>
        <span>Download My Data</span>
      </button>
      <button mat-stroked-button (click)="fileInput.click()">
        <mat-icon>upload</mat-icon>
        <span>Load Data from File</span>
      </button>
      <input 
        #fileInput 
        type="file" 
        style="display: none" 
        (change)="onLoadData($event)"
        accept=".json"
      >
      <button mat-stroked-button (click)="onSeedSample()">
        <mat-icon>auto_fix_high</mat-icon>
        <span>Seed Sample Data</span>
      </button>
    </div>
    <span class="spacer"></span>
    <button mat-button color="warn" (click)="onResetApp()">
      <mat-icon>refresh</mat-icon>
      <span>Reset App</span>
    </button>
  </footer>
</div>
